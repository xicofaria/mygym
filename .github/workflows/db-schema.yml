name: Database schema

# Manual recovery path for the production Turso schema. Normal production
# deployments run the same verified, versioned migrations from `postbuild`,
# before Vercel activates a successfully compiled build. Keeping this workflow
# manual avoids racing a live deployment while retaining a least-privileged
# repair mechanism.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-schema
  cancel-in-progress: false

jobs:
  migrate-schema:
    name: Migrate schema on Turso
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      # Without this guard, missing secrets would make drizzle.config.ts fall
      # back to file:./dev.db and the job would "succeed" without touching prod.
      - name: Ensure production credentials are configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not configured."
            exit 1
          fi
          case "$DATABASE_URL" in
            libsql://*) ;;
            *)
              echo "::error::DATABASE_URL is not a Turso libsql:// URL."
              exit 1
              ;;
          esac
          if [ -z "$DATABASE_AUTH_TOKEN" ]; then
            echo "::error::DATABASE_AUTH_TOKEN secret is not configured."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
        run: npm run db:migrate
