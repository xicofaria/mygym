name: Database schema

# Applies src/db/schema.ts to the production Turso database after a merge to
# main. Vercel's deploy starts at the same time, so there is a window of a few
# seconds where new code may briefly run before an additive change lands —
# harmless for additive changes, which are the only kind this job applies:
# without --force, a non-interactive `drizzle-kit push` fails on anything
# destructive, keeping data-loss changes a manual, deliberate step.

on:
  push:
    branches: [main]
    paths:
      - "src/db/schema.ts"
      - "drizzle.config.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-schema
  cancel-in-progress: false

jobs:
  push-schema:
    name: Apply schema to Turso
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
    steps:
      # Without this guard, missing secrets would make drizzle.config.ts fall
      # back to file:./dev.db and the job would "succeed" without touching prod.
      - name: Ensure production credentials are configured
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not configured."
            exit 1
          fi
          case "$DATABASE_URL" in
            libsql://*) ;;
            *)
              echo "::error::DATABASE_URL is not a Turso libsql:// URL."
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply schema
        run: npx drizzle-kit push
