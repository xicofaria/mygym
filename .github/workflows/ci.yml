name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  DATABASE_URL: file:./ci.db
  SESSION_SECRET: ci-only-session-secret-that-is-longer-than-32-characters

jobs:
  quality:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end workout flow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      DATABASE_URL: file:./e2e.db
      SESSION_SECRET: e2e-only-session-secret-that-is-longer-than-32-characters
      SEED_USER1_NAME: E2E User
      SEED_USER1_EMAIL: e2e@example.com
      SEED_USER1_PASSWORD: e2e-password-123
      SEED_USER2_NAME: E2E Partner
      SEED_USER2_EMAIL: e2e-partner@example.com
      SEED_USER2_PASSWORD: e2e-partner-password-123
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare isolated database
        run: |
          npm run db:push
          npm run db:seed

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
